# DigitalOcean App Platform: Hi-chat in Bangalore (BLR), built from this
# repo's Dockerfile and redeployed on every push to main.
#
# Used by the "Deploy to DigitalOcean" button (docs/deploy-digitalocean.md).
# The keys are not here: paste them on the Environment Variables step (Bulk
# Editor), marked Encrypt.
spec:
  name: hi-chat
  region: blr
  alerts:
    - rule: DEPLOYMENT_FAILED
    - rule: DOMAIN_FAILED
  services:
    - name: web
      github:
        repo: praneeth-pra/hi-chat
        branch: main
        deploy_on_push: true
      dockerfile_path: Dockerfile
      source_dir: /
      # nginx listens on $PORT (nginx.conf is a template)
      http_port: 8080
      instance_size_slug: apps-s-1vcpu-1gb
      instance_count: 1
      health_check:
        http_path: /healthz
        initial_delay_seconds: 10
        period_seconds: 10
        timeout_seconds: 3
        failure_threshold: 6
      envs:
        - key: PORT
          value: "8080"
          scope: RUN_TIME
          type: GENERAL
      alerts:
        - rule: RESTART_COUNT
          operator: GREATER_THAN
          value: 3
          window: FIVE_MINUTES
        - rule: MEM_UTILIZATION
          operator: GREATER_THAN
          value: 85
          window: FIVE_MINUTES
