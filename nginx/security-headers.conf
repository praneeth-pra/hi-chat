# Include inside every location that adds a header: nginx otherwise drops
# server-level add_header inheritance. Keep provider/worker compatibility.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
# The site is HTTPS only (Railway's edge); browsers then never try plain http
add_header Strict-Transport-Security "max-age=31536000" always;
