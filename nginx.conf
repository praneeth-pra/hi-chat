# Dictation relay: a few requests a second at most (one person).
limit_req_zone $binary_remote_addr zone=transcribe:1m rate=60r/m;
# Groq pass-through: chat replies and optional dictation correction.
limit_req_zone $binary_remote_addr zone=groq:1m rate=120r/m;
# Cerebras pass-through: the backup route for chat replies and the dictation judge.
limit_req_zone $binary_remote_addr zone=cerebras:1m rate=120r/m;

# Groq, reached over a few kept-open connections so each request skips the
# TCP and TLS handshake. `resolve` re-looks up api.groq.com as its address
# changes (it sits behind a CDN).
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
upstream groq_api {
    zone groq_api 64k;
    server api.groq.com:443 resolve;
    keepalive 8;
    # Kept open across a pause between questions (Groq and Cerebras close
    # idle connections themselves after a few minutes)
    keepalive_timeout 300s;
    keepalive_time 1h;
}
upstream cerebras_api {
    zone cerebras_api 64k;
    server api.cerebras.ai:443 resolve;
    keepalive 8;
    # Kept open across a pause between questions (Groq and Cerebras close
    # idle connections themselves after a few minutes)
    keepalive_timeout 300s;
    keepalive_time 1h;
}

server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects say "/login", not http://host:$PORT/login (Railway's proxy
    # serves https on 443)
    absolute_redirect off;

    # Site login (relay/auth.mjs): every request needs the signed-in cookie,
    # checked by the relay. With LOGIN_EMAIL unset nobody can sign in.
    auth_request /auth/check;

    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # The login check runs before the body is read, and nginx holds the
        # request's Content-Length to this location's limit: without this,
        # any request over 1 MB (a long chat or images to /api/groq/) is
        # refused here with a 500, whatever its own location allows
        client_max_body_size 25m;
    }

    # The login page and its code requests are open to everyone
    location = /login {
        auth_request off;
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /auth/ {
        auth_request off;
        limit_except POST {
            deny all;
        }
        limit_req zone=transcribe burst=10 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location @login {
        return 302 /login;
    }

    # A mirror link (/m/<secret>): opened without login, it shows one app's
    # conversation. The page is the app shell; what it shows comes over
    # /api/mirror-link, which the relay only opens for a link an app keeps.
    location ^~ /m/ {
        auth_request off;
        limit_except GET {
            deny all;
        }
        try_files /index.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Health check for the host (DigitalOcean, Railway): open without login,
    # since "/" redirects to /login, which some checkers count as a failure
    location = /healthz {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Handle routes with or without trailing slash
    location / {
        # Not signed in: pages go to the login page
        error_page 401 = @login;
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
        # Pages must be revalidated so a new deploy shows up on the next load
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Dictation transcription: the browser uploads each clip once and the relay
    # (relay/server.mjs on 127.0.0.1:3001) sends it to ElevenLabs, adding
    # its API key so the key never reaches the
    # browser. Only signed-in browsers get here (the site login above).
    location = /api/transcribe {
        limit_except POST {
            deny all;
        }
        limit_req zone=transcribe burst=20 nodelay;
        client_max_body_size 25m;
        # Keep typical clips (a few hundred KB) in memory instead of a temp file
        client_body_buffer_size 4m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_read_timeout 220s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Live mode: the relay trades ELEVENLABS_API_KEY for a single-use token
    # so the browser can stream audio straight to ElevenLabs' realtime model.
    location = /api/live-token {
        limit_except POST {
            deny all;
        }
        limit_req zone=transcribe burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Remote mirror (relay/mirror.mjs): Hi-chat sends the open conversation
    # and /mirror on another signed-in browser shows it live. The site login
    # above covers this socket too.
    location = /api/mirror {
        limit_req zone=transcribe burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # A mirror link's socket: no login, the relay checks the link instead
    location = /api/mirror-link {
        auth_request off;
        limit_req zone=transcribe burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Remote camera (relay/camera.mjs): Meet tabs connect here through the
    # Hi-chat extension, which can't send the login cookie, so the relay
    # checks the camera key instead of the site login.
    location = /api/camera {
        auth_request off;
        limit_req zone=transcribe burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The camera key, for the signed-in /mirror page
    location = /api/camera-key {
        limit_except POST {
            deny all;
        }
        limit_req zone=transcribe burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Speech diagnostics: metadata only by default; SPEECH_LOG_TEXT=1 enables text.
    location = /api/speech-log {
        limit_except POST {
            deny all;
        }
        limit_req zone=groq burst=30 nodelay;
        # A long dictation's line (four engines' text) can pass 16 KB; the
        # relay keeps the first 6000 characters
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Optional Accuracy-mode evidence; the Exa key stays in the relay.
    location = /api/search {
        limit_except POST { deny all; }
        limit_req zone=groq burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_read_timeout 8s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Groq pass-through (web-app/src/lib/groqProxy.ts). Safari's direct
    # connections to api.groq.com stall for tens of seconds; going through
    # this server avoids them. The browser's Authorization header (the user's
    # own Groq key) is forwarded unchanged; nothing is stored here.
    location /api/groq/ {
        limit_except GET POST {
            deny all;
        }
        limit_req zone=groq burst=30 nodelay;
        client_max_body_size 25m;
        # Chat requests with long history or images stay in memory too
        client_body_buffer_size 4m;
        rewrite ^/api/groq/(.*)$ /$1 break;
        proxy_pass https://groq_api;
        proxy_ssl_server_name on;
        proxy_ssl_name api.groq.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;
        proxy_set_header Host api.groq.com;
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Stream tokens to the browser as they arrive
        proxy_buffering off;
        # And pass the question upstream as it arrives, rather than after
        # the whole body (history, images) has been read in
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Cerebras pass-through, the same as Groq's: the backup route when a
    # direct request to api.cerebras.ai is slow or fails. The user's own key
    # is forwarded unchanged.
    location /api/cerebras/ {
        limit_except GET POST {
            deny all;
        }
        limit_req zone=cerebras burst=30 nodelay;
        client_max_body_size 25m;
        # Chat requests with long history or images stay in memory too
        client_body_buffer_size 4m;
        rewrite ^/api/cerebras/(.*)$ /$1 break;
        proxy_pass https://cerebras_api;
        proxy_ssl_server_name on;
        proxy_ssl_name api.cerebras.ai;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;
        proxy_set_header Host api.cerebras.ai;
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Stream tokens to the browser as they arrive
        proxy_buffering off;
        # And pass the question upstream as it arrives, rather than after
        # the whole body (history, images) has been read in
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Old NextChat service worker path: always fetch the replacement fresh
    location = /serviceWorker.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # Compress downloaded text assets; event streams keep proxy_buffering off.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # pdf.js loads its worker as an .mjs module, which browsers only run when
    # it's served as JavaScript (older nginx mime.types lack .mjs)
    # The app's code, styles, fonts and images hold no secrets, and a mirror
    # link's page needs them before any login, so they are open to everyone
    location ~* \.mjs$ {
        auth_request off;
        types { }
        default_type text/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, no-cache" always;
    }

    # Only Vite's content-addressed assets can be cached across deployments.
    location ~* "^/assets/.+-[a-z0-9_-]{8,}\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$" {
        auth_request off;
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }

    # Public filenames (icons, scripts, fonts) may change without a new URL.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        auth_request off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, no-cache" always;
    }
}
