# Speaker transcription relay: a few requests a second at most (one person).
limit_req_zone $binary_remote_addr zone=transcribe:1m rate=60r/m;
# Groq pass-through: chat replies plus one relevance check per speaker clip.
limit_req_zone $binary_remote_addr zone=groq:1m rate=120r/m;

# Groq, reached over a few kept-open connections so each request skips the
# TCP and TLS handshake. `resolve` re-looks up api.groq.com as its address
# changes (it sits behind a CDN).
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
upstream groq_api {
    zone groq_api 64k;
    server api.groq.com:443 resolve;
    keepalive 8;
    keepalive_timeout 60s;
}

server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Site login (relay/auth.mjs): every request needs the signed-in cookie,
    # checked by the relay. With LOGIN_EMAIL unset the check always passes.
    auth_request /auth/check;

    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:3001;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # The login page and its code requests are open to everyone
    location = /login {
        auth_request off;
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /auth/ {
        auth_request off;
        limit_except POST {
            deny all;
        }
        limit_req zone=transcribe burst=10 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "no-store" always;
    }

    location @login {
        return 302 /login;
    }

    # Handle routes with or without trailing slash
    location / {
        # Not signed in: pages go to the login page
        error_page 401 = @login;
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
        # Pages must be revalidated so a new deploy shows up on the next load
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Speaker transcription: the browser uploads each clip once and the relay
    # (relay/server.mjs on 127.0.0.1:3001) sends it to ElevenLabs, Grok and
    # AssemblyAI, adding their API keys so the keys never reach the
    # browser. Only signed-in browsers get here (the site login above).
    location = /api/transcribe {
        limit_except POST {
            deny all;
        }
        limit_req zone=transcribe burst=20 nodelay;
        client_max_body_size 25m;
        # Keep typical clips (a few hundred KB) in memory instead of a temp file
        client_body_buffer_size 4m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Cookie "";
        proxy_read_timeout 220s;
        add_header Cache-Control "no-store" always;
    }

    # Live mode: the relay trades ELEVENLABS_API_KEY for a single-use token
    # so the browser can stream audio straight to ElevenLabs' realtime model.
    location = /api/live-token {
        limit_except POST {
            deny all;
        }
        limit_req zone=transcribe burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Cookie "";
        add_header Cache-Control "no-store" always;
    }

    # Grok live: browsers can't open xAI's streaming socket themselves (the
    # key goes in a header), so the relay pipes this WebSocket to it. A browser
    # connects with a single-use ticket from /api/live-token, which the relay
    # checks.
    location = /api/grok-live {
        limit_req zone=transcribe burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Dictation: your own recorded voice goes to Aqua's dictation route
    # (relay/server.mjs adds AQUA_API_KEY), so your Aqua dictionary applies.
    location = /api/dictate {
        limit_except POST {
            deny all;
        }
        limit_req zone=transcribe burst=20 nodelay;
        client_max_body_size 25m;
        client_body_buffer_size 4m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Cookie "";
        proxy_read_timeout 220s;
        add_header Cache-Control "no-store" always;
    }

    # Dictation judge test: logged dictations, kept off the public bundle.
    location = /api/judge-samples {
        limit_except POST {
            deny all;
        }
        limit_req zone=groq burst=30 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Cookie "";
        add_header Cache-Control "no-store" always;
    }

    # Speaker clip log: the browser reports each clip's text and verdict so
    # they show in Railway's logs (relay/server.mjs prints one line each).
    location = /api/speaker-log {
        limit_except POST {
            deny all;
        }
        limit_req zone=groq burst=30 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Cookie "";
        add_header Cache-Control "no-store" always;
    }

    # Groq pass-through (web-app/src/lib/groqProxy.ts). Safari's direct
    # connections to api.groq.com stall for tens of seconds; going through
    # this server avoids them. The browser's Authorization header (the user's
    # own Groq key) is forwarded unchanged; nothing is stored here.
    location /api/groq/ {
        limit_except GET POST {
            deny all;
        }
        limit_req zone=groq burst=30 nodelay;
        client_max_body_size 25m;
        # Chat requests with long history or images stay in memory too
        client_body_buffer_size 4m;
        rewrite ^/api/groq/(.*)$ /$1 break;
        proxy_pass https://groq_api;
        proxy_ssl_server_name on;
        proxy_ssl_name api.groq.com;
        proxy_ssl_session_reuse on;
        proxy_set_header Host api.groq.com;
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Stream tokens to the browser as they arrive
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # Old NextChat service worker path: always fetch the replacement fresh
    location = /serviceWorker.js {
        add_header Cache-Control "no-cache" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # pdf.js loads its worker as an .mjs module, which browsers only run when
    # it's served as JavaScript (older nginx mime.types lack .mjs)
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}