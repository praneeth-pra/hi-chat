name: Windows app

on:
  push:
    branches: [main]
    paths: ['windows-app/**', '.github/workflows/windows-app.yml']
  pull_request:
    branches: [main]
    paths: ['windows-app/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:

# A new push to a pull request cancels its older build; builds on main finish
concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Builds can only read the repository; only publishing from main may write
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # One Hi-chat.exe on .NET Framework 4.8 (part of Windows 10 and 11),
      # with WebView2's DLLs packed inside it
      - name: Build Hi-chat.exe
        run: >
          dotnet build windows-app/HiChat.csproj -c Release
          -p:Version=1.0.${{ github.run_number }} -o windows-app/out
      - uses: actions/upload-artifact@v4
        with:
          name: Hi-chat-exe
          path: windows-app/out/Hi-chat.exe

  publish:
    needs: build
    # Releases come only from main: never from a pull request or another branch
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # HICHAT_SIGNING lives in the "release" environment, limited to main
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hi-chat-exe
          path: windows-app/out
      # The apps install only updates signed with this key (see Updater)
      - name: Sign the update
        env:
          HICHAT_SIGNING: ${{ secrets.HICHAT_SIGNING }}
        run: |
          if [ -z "$HICHAT_SIGNING" ]; then
            echo "::error::The HICHAT_SIGNING secret is missing, so this release can't be signed"
            exit 1
          fi
          keys=$(mktemp -d)
          echo "$HICHAT_SIGNING" | base64 --decode | tar -xzf - -C "$keys"
          openssl dgst -sha256 -sign "$keys/update.pem" -out windows-app/out/Hi-chat.exe.sig windows-app/out/Hi-chat.exe
          rm -rf "$keys"
      # Windows releases are win-1.0.N and never "latest": the Mac app's
      # updater reads the latest release. The Windows app finds its own.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "win-1.0.${{ github.run_number }}" windows-app/out/Hi-chat.exe windows-app/out/Hi-chat.exe.sig \
            --title "Hi-chat for Windows 1.0.${{ github.run_number }}" \
            --notes "Download Hi-chat.exe and open it. It installs itself for your Windows user and adds Hi-chat to the Start menu." \
            --target "${{ github.sha }}" --latest=false
